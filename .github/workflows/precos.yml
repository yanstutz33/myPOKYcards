name: Atualizar preços

# Todo dia às 09:00 UTC (06:00 em Brasília). Depois do fechamento americano
# e antes do horário comercial daqui, então o dado do dia já estabilizou.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:        # botão manual, para testar sem esperar o cron

concurrency:
  # Duas execuções ao mesmo tempo brigariam pelo commit do histórico.
  group: precos
  cancel-in-progress: false

permissions:
  contents: write           # commitar o histórico e publicar em gh-pages

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # medido: ~3 min; a folga cobre a fonte lenta

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # O catálogo é reconstruído do zero: 2 minutos, e evita versionar
      # 15 MB de banco que muda a cada release do TCGdex.
      - name: Reconstruir catálogo
        run: |
          git clone --depth 1 --quiet https://github.com/tcgdex/cards-database.git /tmp/tcgdex
          python pipeline/ingest_tcgdex.py --repo /tmp/tcgdex --out data/cards.db

      # Os invariantes rodam ANTES de publicar. Cada um existe porque um bug
      # real passou por ele, e nenhum daqueles bugs quebrava nada — todos
      # apareciam como número que não fecha.
      - name: Conferir invariantes do catálogo
        run: python tests/test_invariantes.py

      - name: Coletar preços e gerar artefatos
        run: python pipeline/refresh_prices.py --site "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      # O histórico é a única coisa insubstituível: um dia perdido é perdido
      # para sempre. Vai para o main, não para gh-pages, que é reescrito.
      # A coleta leva ~3 min na rede do runner. Qualquer commit no main
      # nesse intervalo faz o push ser rejeitado — aconteceu na primeira
      # execução. Rebase antes de
      # empurrar, com retentativa: só este arquivo é tocado, então rebase é
      # seguro.
      - name: Guardar o histórico
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price_history.csv.gz
          if git diff --staged --quiet; then
            echo "histórico sem mudança"; exit 0
          fi
          git commit -m "Histórico de preço: $(date -u +%Y-%m-%d)"
          for tentativa in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push rejeitado (tentativa $tentativa), refazendo o rebase"
            sleep 5
          done
          exit 1

      # Derivados do histórico e do catálogo. Sem estes passos o gráfico da
      # ficha congelaria no dia em que o arquivo foi gerado à mão, e o
      # vocabulário do OCR ficaria sem as cartas dos sets novos — os dois
      # falhando em silêncio, que é o modo de falha que este projeto persegue.
      - name: Exportar a série histórica
        run: python pipeline/export_historico.py

      - name: Exportar o vocabulário do OCR
        run: python pipeline/export_ocr_names.py

      # Só os arquivos derivados de preço e catálogo. index.bin e cards.json
      # descrevem o índice de reconhecimento, que não muda aqui — reenviá-los
      # seria arriscar sobrescrever o índice com uma versão incompleta.
      - name: Publicar no site
        run: |
          git fetch origin gh-pages --depth 1
          git worktree add /tmp/site gh-pages
          # Copia arquivo a arquivo e tolera ausência: uma indisponibilidade
          # do Banco Central derrubou a publicação inteira, inclusive os
          # preços que já estavam coletados. Se fx.json não veio, o que já
          # está publicado continua valendo — a interface mostra a data da
          # taxa, então cotação velha aparece velha.
          for f in prices.json prices.json.gz fx.json dashboard.json numeros.json                    historico.json historico.json.gz nomes.json nomes.json.gz; do
            if [ -f "web/data/$f" ]; then cp "web/data/$f" /tmp/site/data/; else echo "sem $f, mantendo o publicado"; fi
          done
          cd /tmp/site
          git add data/
          git diff --staged --quiet && echo "nada mudou" && exit 0
          git commit -m "Preços de $(date -u +%Y-%m-%d)"
          git push origin gh-pages

      # Silêncio não pode parecer sucesso: se a coleta trouxe zero preço,
      # algo quebrou na fonte e o job precisa falhar de forma visível.
      - name: Conferir invariantes dos preços
        run: python tests/test_invariantes.py

      - name: Conferir que veio dado
        run: |
          python - <<'PY'
          import json, sys, pathlib
          d = json.loads(pathlib.Path("web/data/prices.json").read_text(encoding="utf-8"))
          print(f"{len(d)} cartas com preço")
          if len(d) < 5000:
              sys.exit(f"apenas {len(d)} cartas — abaixo do esperado, investigar")
          PY
