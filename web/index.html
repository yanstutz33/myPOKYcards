<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#B0241C">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>myPOKYcards · Leitor de cartas</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tema.css">
  <link rel="stylesheet" href="scan.css">
  <link rel="stylesheet" href="pokedex.css">
</head>
<body class="scan-body">

  <header class="topbar">
    <a class="brand" href="sobre.html">myPOKY<b>cards</b></a>
    <span class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">carregando…</span>
    </span>
    <button id="audio" class="audio" aria-pressed="true" aria-label="Desligar sons">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
        <path class="onda" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"
              fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        <path class="corte" d="M17 9l5 6M22 9l-5 6"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <nav class="topnav">
      <a href="buscar.html">Buscar</a>
      <a href="colecao.html">Coleção</a>
      <a href="painel.html">Painel</a>
    </nav>
  </header>

  <main class="stage" id="stage">
    <video id="video" playsinline muted autoplay></video>

    <!-- A moldura é sugestão de enquadramento. O recorte real vem da borda
         detectada, desenhada por cima em .achado. -->
    <div class="frame" id="frame">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
      <div class="sweep"></div>
    </div>
    <div class="achado" id="achado" hidden></div>

    <!-- Aqui existiu um destaque de preço flutuando sobre a câmera. Ficava
         em cima da carta, que é o único lugar da tela que precisa estar
         livre. O valor voltou para o painel, embaixo, e continua grande. -->

    <p class="hint" id="hint">Aponte para a carta</p>

    <!-- Diagnóstico: liga com ?diag. Existe para calibrar limiar com
         aparelho real, porque foto de celular não se parece com a imagem
         perfeita do catálogo. -->
    <pre class="diag" id="diag" hidden></pre>
  </main>

  <!-- Tudo que não é câmera vive nesta pilha, SOBRE a câmera. Antes eram
       linhas de grade dividindo a tela, e a câmera ficava com 37% dela —
       303px para enquadrar uma carta. Empilhado por cima, o vídeo ocupa a
       tela inteira e só o que está em uso cobre alguma parte dele. -->
  <div class="base-stack">

  <!-- Barra de captura: sempre disponível, independente do automático.
       O usuário nunca pode ficar preso esperando o leitor decidir. -->
  <div class="barra" id="barra">
    <button id="capturar" class="captura" aria-label="Capturar carta">
      <span class="captura-anel"></span>
    </button>
    <button id="retomar" class="secundaria" hidden>Ler outra</button>
    <!-- Só aparece se o aparelho declarar `torch`. iPhone não implementa,
         e botão que não faz nada é pior que botão nenhum. -->
    <button id="lanterna" class="lanterna" hidden aria-pressed="false"
            aria-label="Lanterna">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M9 2h6v3l-1.5 2v13a1.5 1.5 0 0 1-3 0V7L9 5V2z"
              fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linejoin="round"/>
        <path d="M10.5 11h3" stroke="currentColor" stroke-width="1.8"/>
      </svg>
    </button>
  </div>

  <!-- Nasce vazio: a instrução já está sobre a câmera, em .hint, e repetir
       aqui custaria 40% do visor para dizer duas vezes a mesma coisa. -->
  <section class="sheet vazio" id="sheet" aria-live="polite">
    <div class="results" id="results"></div>
  </section>

  <div class="acoes-base">
    <button id="toggle" class="primary" disabled>Ligar leitor</button>
  </div>

  </div><!-- /base-stack -->

  <div class="ficha" id="ficha" hidden></div>

  <script type="module" src="app.js"></script>
  <script type="module" src="pwa.js"></script>
</body>
</html>
