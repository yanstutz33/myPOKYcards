<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06080C">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>YAMI-TCG · Leitor de cartas</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tema.css">
  <link rel="stylesheet" href="scan.css">
</head>
<body class="scan-body">

  <header class="topbar">
    <a class="brand" href="sobre.html">YAMI · TCG</a>
    <span class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">carregando…</span>
    </span>
    <nav class="topnav">
      <a href="colecao.html">Coleção</a>
      <a href="painel.html">Painel</a>
    </nav>
  </header>

  <main class="stage" id="stage">
    <video id="video" playsinline muted autoplay></video>

    <!-- A moldura é sugestão de enquadramento. O recorte real vem da borda
         detectada, desenhada por cima em .achado. -->
    <div class="frame" id="frame">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
      <div class="sweep"></div>
    </div>
    <div class="achado" id="achado" hidden></div>

    <p class="hint" id="hint">Aponte para a carta</p>

    <!-- Diagnóstico: liga com ?diag. Existe para calibrar limiar com
         aparelho real, porque foto de celular não se parece com a imagem
         perfeita do catálogo. -->
    <pre class="diag" id="diag" hidden></pre>
  </main>

  <!-- Barra de captura: sempre disponível, independente do automático.
       O usuário nunca pode ficar preso esperando o leitor decidir. -->
  <div class="barra" id="barra">
    <button id="capturar" class="captura" aria-label="Capturar carta">
      <span class="captura-anel"></span>
    </button>
    <button id="retomar" class="secundaria" hidden>Ler outra</button>
    <!-- Só aparece se o aparelho declarar `torch`. iPhone não implementa,
         e botão que não faz nada é pior que botão nenhum. -->
    <button id="lanterna" class="lanterna" hidden aria-pressed="false"
            aria-label="Lanterna">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M9 2h6v3l-1.5 2v13a1.5 1.5 0 0 1-3 0V7L9 5V2z"
              fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linejoin="round"/>
        <path d="M10.5 11h3" stroke="currentColor" stroke-width="1.8"/>
      </svg>
    </button>
  </div>

  <section class="sheet" id="sheet" aria-live="polite">
    <div class="results" id="results">
      <p class="empty">Toque em <strong>Iniciar</strong> e aponte para uma carta.<br>
        Não precisa encaixar exato — o leitor acha a borda sozinho.</p>
    </div>
  </section>

  <div class="acoes-base">
    <button id="toggle" class="primary" disabled>Iniciar câmera</button>
  </div>

  <script type="module" src="app.js"></script>
  <script type="module" src="pwa.js"></script>
</body>
</html>
