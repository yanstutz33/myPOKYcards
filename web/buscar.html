<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#B0241C">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>myPOKYcards · Buscar carta</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tema.css">
  <link rel="stylesheet" href="scan.css">
  <link rel="stylesheet" href="pokedex.css">
  <link rel="stylesheet" href="vidro.css">
</head>
<body class="scan-body busca-body">

  <header class="topbar">
    <a class="brand" href="sobre.html">myPOKY<b>cards</b></a>
    <nav class="topnav">
      <a href="index.html">Leitor</a>
      <a href="colecao.html">Coleção</a>
    </nav>
  </header>

  <div class="busca-campo">
    <input id="q" type="search" inputmode="search" autocomplete="off"
           placeholder="Nome, expansão ou número…" aria-label="Buscar carta">
    <!-- Filtros. Com algum escolhido, a busca roda sem nome: "Enchanted de
         Lorcana acima de R$ 500" é uma pergunta inteira. A faixa é em real
         pela PTAX; a lista continua mostrando cada preço na moeda dele. -->
    <div class="filtros" id="filtros">
      <select id="fJogo" aria-label="Jogo">
        <option value="">Todos os jogos</option>
        <option value="pokemon">Pokémon</option>
        <option value="onepiece">One Piece</option>
        <option value="lorcana">Lorcana</option>
        <option value="riftbound">Riftbound</option>
      </select>
      <select id="fRaridade" aria-label="Raridade">
        <option value="">Qualquer raridade</option>
      </select>
      <input id="fMin" type="number" inputmode="decimal" min="0" step="1"
             placeholder="R$ mín." aria-label="Preço mínimo em reais">
      <input id="fMax" type="number" inputmode="decimal" min="0" step="1"
             placeholder="R$ máx." aria-label="Preço máximo em reais">
      <select id="fOrdem" aria-label="Ordenar">
        <option value="relevancia">Relevância</option>
        <option value="maior">Mais caras</option>
        <option value="menor">Mais baratas</option>
      </select>
      <button type="button" id="fLimpar" hidden>Limpar</button>
    </div>
  </div>

  <main class="busca-lista" id="lista">
    <p class="busca-vazio">Digite pelo menos duas letras.<br>
      Busca em 30 mil cartas, no próprio aparelho.</p>
  </main>

  <div class="ficha" id="ficha" hidden></div>

  <script type="module" src="busca-tela.js"></script>
  <script type="module" src="pwa.js"></script>
</body>
</html>
